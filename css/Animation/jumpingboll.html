<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jumping a boll</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 50vh;
            background-color:aquamarine;
    
        }
        .boll{
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: blue;
            position: relative;
            /* animation-name: bounce;
            animation-duration: 2s;
            animation-iteration-count: infinite; */
            animation: bounce 2s infinite;
        }
        @keyframes bounce{
            0%{height: 50px;}
            30%{
                height: 50px;
                width: 40;
            }
            50%{
                height: 35px;
                width: 47px;
                transform: translate-Y(350px);
            }
        }
      
    </style>
</head>
<body>
    <div class="boll"></div>
</body>
</html>
