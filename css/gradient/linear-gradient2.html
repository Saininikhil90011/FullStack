<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grad1{
            height: 300px;
            /* width: 300px; */
            background-color: red;
            background-image: repeating-linear-gradient(red, yellow 10%, green 20%);
        }
        .grad2{
            height: 300px;
            /* width: 300px; */
            background-color: red;
            background-image:  repeating-linear-gradient(45deg,red,yellow 7%,green 10%);
        }
        .grad3{
            height: 300px;
            background-color: red;
            background-image:  repeating-linear-gradient(90deg,red,yellow 7%,green 10%);
        }
        .grad4{
            height: 300px;
            background-color: red;
            background-image:  repeating-linear-gradient(300deg,red,yellow 6%,green 10%);
        }
        p{
            font-size: 30px;
        }
    </style>
</head>
<body>
    <!-- <p>Repeating gradient</p> -->
     <H1>linear-gradient</H1>
    <div class="grad1"></div>
    <h1>45 deg rotate</h1>
    <div class="grad2"></div>
    <h1>90 deg rotate</h1>
    <div class="grad3"></div>
    <h1>150 deg rotate</h1>
    <div class="grad4"></div>


</body>
</html>
